# 三级知识分类体系
# lvl1 -> lvl2 -> lvl3

taxonomy:
  形制与技术:
    结构体系:
      - 拱桥结构
      - 梁桥结构
      - 悬索结构
      - 斜拉结构
      - 组合结构
    构造细部:
      - 桥墩设计
      - 桥台构造
      - 栏杆装饰
      - 桥面铺装
      - 伸缩缝节点
    材料工艺:
      - 石材加工
      - 木材处理
      - 铁件锻造
      - 混凝土浇筑
    建造技术:
      - 施工方法
      - 测量定位
      - 脚手架搭设
      - 吊装技术

  地域与环境:
    水文地形:
      - 河流特征
      - 峡谷地形
      - 平原水网
      - 山区溪流
    气候特征:
      - 季节洪水
      - 冻融循环
      - 台风影响
      - 干旱环境
    地质条件:
      - 地基处理
      - 岩土特性
      - 地震设防
      - 软土加固

  功能与社会:
    交通功能:
      - 公路通行
      - 铁路运输
      - 人行通道
      - 综合交通
    军事防御:
      - 关隘要塞
      - 战略要道
      - 防御工事
    景观价值:
      - 风景名胜
      - 文化地标
      - 园林景观
      - 城市名片

  历史与演变:
    建造年代:
      - 始建时间
      - 建造背景
      - 工匠记载
    修缮记录:
      - 历代维修
      - 重建改造
      - 现代修复
    变迁历史:
      - 功能变化
      - 名称演变
      - 归属变更
