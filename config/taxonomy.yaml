# 三级知识分类体系 — lvl1 -> lvl2 -> lvl3
#
# ⚠️  SEED ONLY — 运行期不要再改这个文件。
#
# 这份 YAML 只在首次启动时（database.py: init_database 空表判断）被灌入
# ``taxonomy_nodes`` 表一次。之后所有读取路径（tagger、admin tree、tagger
# 白名单、chunk batch-update 校验）都直接从 DB 读，YAML 不再被消费。
#
# 要调整分类：走 /api/v1/taxonomy/nodes 端点或管理后台 UI（这两条路径都
# 写 DB + 失效缓存）。改这个文件只会影响**全新环境**的初始 seed。
#
# 背景：2026-04 之前，tagger 绕过 DB 直接读这里 + @lru_cache，导致管理员
# 修改 taxonomy 后新入库仍用旧分类。修复见 tagger.py + taxonomy_loader.py。

taxonomy:
  形制与技术:
    结构体系:
      - 拱桥结构
      - 梁桥结构
      - 悬索结构
      - 斜拉结构
      - 组合结构
    构造细部:
      - 桥墩设计
      - 桥台构造
      - 栏杆装饰
      - 桥面铺装
      - 伸缩缝节点
    材料工艺:
      - 石材加工
      - 木材处理
      - 铁件锻造
      - 混凝土浇筑
    建造技术:
      - 施工方法
      - 测量定位
      - 脚手架搭设
      - 吊装技术

  地域与环境:
    水文地形:
      - 河流特征
      - 峡谷地形
      - 平原水网
      - 山区溪流
    气候特征:
      - 季节洪水
      - 冻融循环
      - 台风影响
      - 干旱环境
    地质条件:
      - 地基处理
      - 岩土特性
      - 地震设防
      - 软土加固

  功能与社会:
    交通功能:
      - 公路通行
      - 铁路运输
      - 人行通道
      - 综合交通
    军事防御:
      - 关隘要塞
      - 战略要道
      - 防御工事
    景观价值:
      - 风景名胜
      - 文化地标
      - 园林景观
      - 城市名片

  历史与演变:
    建造年代:
      - 始建时间
      - 建造背景
      - 工匠记载
    修缮记录:
      - 历代维修
      - 重建改造
      - 现代修复
    变迁历史:
      - 功能变化
      - 名称演变
      - 归属变更
